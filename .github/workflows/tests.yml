name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked platform and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
