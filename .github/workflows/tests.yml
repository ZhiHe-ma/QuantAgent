name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked platform and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

  architecture:
    name: Architecture / Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      ARCHITECTURE_BRANCH: ${{ github.head_ref || github.ref_name }}
      ARCHITECTURE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked test and architecture dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run architecture checker regression tests
        run: python -m unittest discover -s tests/architecture -v
      - name: Check dependencies, legacy debt and documentation
        run: python -m tools.architecture --report artifacts/architecture/ci-report.json
