manifest_type: quantagent.agent_manifest.v2
agent_id: builtin.sec-evidence-producer-agent
version: 1.0.0
skills:
  - id: builtin.sec-evidence-preparation
    version: 1.0.0
recipes:
  - id: sec-evidence-producer
    version: 1.0.0
model_policy:
  required_capabilities:
    text_generation: false
    structured_output: false
    tool_calling: false
    min_context_tokens: 1
    offline_replay: false
  allowed_models: []
  allow_recorded_replay: false
  selection: ordered_allowlist
input_contract: quantagent.sec_approved_run.v1
output_contract: quantagent.sec_evidence_bundle.v1
required_capabilities:
  - source.sec_approved_run
  - research.sec_evidence_bundle
review_gates:
  - gate_id: validate-before-run
    trigger: before_run
    action: automatic_validation
    on_reject: fail
limits:
  max_steps: 2
  max_tool_calls: 1
  max_wall_seconds: 120
  max_cost:
    amount_minor: 0
    currency: USD
callable_agents:
  - id: builtin.sec-evidence-review-agent
    version: 1.0.0
metadata:
  deterministic: true
  coordinator_only: true
  trading_authority: false
